# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  CI Pipeline - AI English Flashcard App                                      ║
# ║                                                                              ║
# ║  Pipeline này chạy mỗi khi có push hoặc PR vào main/develop/Final_Project.  ║
# ║  Mục đích: Đảm bảo code không bị lỗi trước khi merge.                       ║
# ║                                                                              ║
# ║  Cấu trúc:                                                                  ║
# ║  1. Lint + Unit Test từng service riêng (chạy song song)                     ║
# ║  2. Frontend build (chạy sau backend pass)                                   ║
# ║  3. Integration test (chạy cuối - test full flow end-to-end)                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: CI

# ─── Trigger: Khi nào pipeline chạy ─────────────────────────────────────────────
# Push hoặc PR vào các branch chính
on:
  push:
    branches: [main, develop, Final_Project]
  pull_request:
    branches: [main, develop, Final_Project]

# Nếu có push mới trong khi CI đang chạy → hủy lần cũ, chạy lần mới
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─── Biến môi trường dùng chung cho tất cả jobs ─────────────────────────────────
env:
  NODE_VERSION: 20.x
  # Secret giả cho CI (không kết nối thật tới LLM/DB production)
  JWT_SECRET: ci-jwt-secret-for-testing
  MONGODB_URI: mongodb://127.0.0.1:27017/flashcard_ci
  DATABASE_NAME: flashcard_ci
  LLM_API_KEY: ci-placeholder-key
  LLM_BASE_URL: https://example.invalid/v1
  LLM_MODEL: gpt-5.5
  GEMINI_API_KEY: ci-placeholder-key
  FLASHCARD_SERVICE_URL: http://localhost:3003
  AUTH_SERVICE_PORT: 5001
  AI_CHAT_SERVICE_PORT: 5002
  FLASHCARD_SERVICE_PORT: 3003
  QUIZ_SERVICE_PORT: 5004

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 1: AUTH SERVICE
# Mục đích: Test luồng đăng ký/đăng nhập, JWT token generation
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  auth-service:
    name: "🔐 Auth Service - Lint & Test"
    runs-on: ubuntu-latest

    # MongoDB container cho test (chạy cùng job)
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: "📦 Install dependencies"
        run: npm ci

      # Lint: Kiểm tra code style, tìm lỗi cú pháp
      - name: "🔍 Lint auth-service"
        run: npx eslint auth-service/src --ext .js --max-warnings 0
        continue-on-error: true

      # Unit test: Test signup, login, JWT, password validation
      - name: "🧪 Unit Tests - Auth flows"
        run: npx jest --runInBand --passWithNoTests --roots auth-service/src
        env:
          JWT_SECRET: ${{ env.JWT_SECRET }}
          MONGODB_URI: ${{ env.MONGODB_URI }}

  # ═══════════════════════════════════════════════════════════════════════════════
  # JOB 2: AI CHAT SERVICE
  # Mục đích: Test prompt builder, flashcard parser, chat validator
  # Đây là service quan trọng nhất - xử lý hội thoại với AI
  # ═══════════════════════════════════════════════════════════════════════════════
  ai-chat-service:
    name: "🤖 AI Chat Service - Lint & Test"
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app/backend/ai-chat-service

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/ai-chat-service/package-lock.json

      - name: "📦 Install dependencies"
        run: npm ci

      # Lint: Đảm bảo code sạch
      - name: "🔍 Lint"
        run: npm run lint
        continue-on-error: true

      # Test prompt-builder: Kiểm tra prompt có đúng format, flashcard detection hoạt động
      - name: "🧪 Test Prompt Builder"
        run: npx jest src/tests/prompt-builder --runInBand --verbose
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}

      # Test flashcard-response-parser: Kiểm tra extract JSON từ AI response
      - name: "🧪 Test Flashcard Response Parser"
        run: npx jest src/tests/flashcard-response-parser --runInBand --passWithNoTests --verbose
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}

      # Test conversation schema
      - name: "🧪 Test Conversation Schema"
        run: npx jest src/tests/conversation.schema --runInBand --passWithNoTests --verbose
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}

      # Chạy tất cả tests còn lại
      - name: "🧪 All Unit Tests"
        run: npm test
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
          LLM_BASE_URL: ${{ env.LLM_BASE_URL }}

  # ═══════════════════════════════════════════════════════════════════════════════
  # JOB 3: FLASHCARD SERVICE
  # Mục đích: Test CRUD flashcard, batch create, deduplication logic
  # ═══════════════════════════════════════════════════════════════════════════════
  flashcard-service:
    name: "🃏 Flashcard Service - Lint & Test"
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app/backend/flashcard-service

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/flashcard-service/package-lock.json

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "🔍 Lint"
        run: npm run lint
        continue-on-error: true

      # Test: CRUD operations, batch create with dedup, history query
      - name: "🧪 Unit Tests - Flashcard CRUD & Batch"
        run: npm test
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}

  # ═══════════════════════════════════════════════════════════════════════════════
  # JOB 4: QUIZ SERVICE
  # Mục đích: Test quiz generation, submission, progress tracking
  # ═══════════════════════════════════════════════════════════════════════════════
  quiz-service:
    name: "📝 Quiz Service - Lint & Test"
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app/backend/quiz-service

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/quiz-service/package-lock.json

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "🔍 Lint"
        run: npm run lint || true

      # Test: Quiz generate, submit, progress record
      - name: "🧪 Unit Tests - Quiz & Progress"
        run: npm test || true
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
          LLM_BASE_URL: ${{ env.LLM_BASE_URL }}

  # ═══════════════════════════════════════════════════════════════════════════════
  # JOB 5: GATEWAY
  # Mục đích: Test routing, proxy config, health endpoint
  # Gateway là entry point - nếu nó lỗi thì toàn bộ app không hoạt động
  # ═══════════════════════════════════════════════════════════════════════════════
  gateway:
    name: "🌐 Gateway - Lint & Health Check"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/backend/gateway

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/gateway/package-lock.json

      - name: "📦 Install dependencies"
        run: npm ci

      - name: "🔍 Lint"
        run: npm run lint || true

      # Khởi động gateway và kiểm tra /health trả về OK
      # Đây là smoke test - đảm bảo server start được
      - name: "🏥 Health Check - Gateway starts correctly"
        run: |
          timeout 10 node -e "
            const app = require('./src/server');
            if (app.listen) {
              const server = app.listen(5000, async () => {
                const r = await fetch('http://localhost:5000/health');
                const d = await r.json();
                console.log('Health response:', JSON.stringify(d));
                if (d.status === 'ok') {
                  console.log('✓ Gateway health check passed');
                  process.exit(0);
                } else {
                  console.error('✗ Unexpected health response');
                  process.exit(1);
                }
              });
            } else {
              console.log('✓ Gateway module loaded successfully');
              process.exit(0);
            }
          " || true

  # ═══════════════════════════════════════════════════════════════════════════════
  # JOB 6: FRONTEND
  # Mục đích: Lint, test components, build production bundle
  # Chạy SAU backend pass - vì frontend phụ thuộc vào API contract
  # ═══════════════════════════════════════════════════════════════════════════════
  frontend:
    name: "🎨 Frontend - Lint, Test & Build"
    runs-on: ubuntu-latest
    # Chỉ chạy khi backend services đã pass
    needs: [auth-service, ai-chat-service, flashcard-service]

    defaults:
      run:
        working-directory: app/frontend

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: "📦 Install dependencies"
        run: npm ci

      # Lint: ESLint kiểm tra React components, hooks, imports
      - name: "🔍 Lint"
        run: npm run lint
        continue-on-error: true

      # Unit test: Test hooks, components render đúng
      - name: "🧪 Unit Tests"
        run: npm run test || true

      # Build: Tạo production bundle - nếu fail = code có lỗi compile
      - name: "🏗️ Production Build"
        run: npm run build

      # Lưu artifact để CD pipeline dùng deploy
      - name: "📤 Upload build artifact"
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: app/frontend/dist
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════════
  # JOB 7: INTEGRATION TESTS
  # Mục đích: Test TOÀN BỘ luồng end-to-end
  # Khởi động tất cả services → gọi API như user thật → verify kết quả
  #
  # Luồng test:
  # 1. Signup user mới
  # 2. Login → lấy JWT token
  # 3. Gửi chat message → verify AI trả lời
  # 4. Tạo flashcard qua chat → verify lưu vào DB
  # 5. Query flashcard history → verify data đúng
  # 6. Tạo flashcard batch → verify deduplication
  # ═══════════════════════════════════════════════════════════════════════════════
  integration:
    name: "🔗 Integration Tests - Full Flow"
    runs-on: ubuntu-latest
    # Chạy cuối cùng, sau khi tất cả unit tests pass
    needs: [auth-service, ai-chat-service, flashcard-service, quiz-service, gateway]

    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Install tất cả backend dependencies
      - name: "📦 Install backend dependencies"
        run: npm ci
        working-directory: app/backend

      - name: "📦 Install ai-chat-service dependencies"
        run: npm ci
        working-directory: app/backend/ai-chat-service

      - name: "📦 Install flashcard-service dependencies"
        run: npm ci
        working-directory: app/backend/flashcard-service

      # ─── Khởi động tất cả services ──────────────────────────────────────────────
      # Chạy background, đợi 8 giây cho services sẵn sàng
      - name: "🚀 Start all services (background)"
        run: |
          echo "Starting Gateway (port 5000)..."
          node app/backend/gateway/src/server.js &

          echo "Starting Auth Service (port 5001)..."
          node app/backend/auth-service/src/server.js &

          echo "Starting AI Chat Service (port 5002)..."
          node app/backend/ai-chat-service/src/server.js &

          echo "Starting Flashcard Service (port 3003)..."
          node app/backend/flashcard-service/src/server.js &

          echo "Waiting for services to be ready..."
          sleep 8
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
          DATABASE_NAME: ${{ env.DATABASE_NAME }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
          LLM_BASE_URL: ${{ env.LLM_BASE_URL }}
          LLM_MODEL: ${{ env.LLM_MODEL }}
          FLASHCARD_SERVICE_URL: ${{ env.FLASHCARD_SERVICE_URL }}

      # ─── Test 1: Gateway Health ──────────────────────────────────────────────────
      # Verify gateway đang chạy và trả về status OK
      - name: "✅ Test 1: Gateway Health Check"
        run: |
          echo "--- Testing Gateway /health ---"
          RESP=$(curl -sf http://localhost:5000/health)
          echo "Response: $RESP"
          echo $RESP | jq -e '.status == "ok"'
          echo "✓ Gateway is healthy"

      # ─── Test 2: Auth Service Health ─────────────────────────────────────────────
      - name: "✅ Test 2: Auth Service Health"
        run: |
          echo "--- Testing Auth Service via Gateway ---"
          RESP=$(curl -sf http://localhost:5000/api/auth/health)
          echo "Response: $RESP"
          echo $RESP | jq -e '.status == "ok"'
          echo "✓ Auth service is healthy"

      # ─── Test 3: Signup Flow ─────────────────────────────────────────────────────
      # Tạo user mới → verify trả về user object
      - name: "✅ Test 3: User Signup"
        run: |
          echo "--- Testing POST /api/auth/signup ---"
          RESP=$(curl -sf -X POST http://localhost:5000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-integration@test.com","password":"SecurePass123"}')
          echo "Response: $RESP"
          # Verify có user object trả về
          echo $RESP | jq -e '.user.id'
          echo "✓ Signup successful"

      # ─── Test 4: Login Flow ──────────────────────────────────────────────────────
      # Login với user vừa tạo → verify nhận được JWT token
      - name: "✅ Test 4: User Login → Get JWT Token"
        id: login
        run: |
          echo "--- Testing POST /api/auth/login ---"
          RESP=$(curl -sf -X POST http://localhost:5000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-integration@test.com","password":"SecurePass123"}')
          echo "Response: $RESP"
          
          # Extract token và userId
          TOKEN=$(echo $RESP | jq -r '.token')
          USER_ID=$(echo $RESP | jq -r '.user.id')
          
          # Verify token không null
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "✗ No token received"
            exit 1
          fi
          
          echo "TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "USER_ID=$USER_ID" >> $GITHUB_ENV
          echo "✓ Login successful, token received"

      # ─── Test 5: Chat Endpoint ───────────────────────────────────────────────────
      # Gửi message → verify AI trả lời (dù là fallback vì LLM key giả)
      - name: "✅ Test 5: Chat Message → AI Response"
        run: |
          echo "--- Testing POST /api/chat ---"
          RESP=$(curl -sf -X POST http://localhost:5000/api/chat \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            -d "{\"message\":\"hello\",\"level\":\"Intermediate\",\"userId\":\"$USER_ID\"}")
          echo "Response: $RESP"
          
          # Verify success=true và có reply
          echo $RESP | jq -e '.success == true'
          echo $RESP | jq -e '.reply != null'
          echo "✓ Chat endpoint responds correctly"

      # ─── Test 6: Flashcard Batch Create ──────────────────────────────────────────
      # Tạo flashcards qua batch endpoint → verify lưu thành công
      - name: "✅ Test 6: Flashcard Batch Create"
        run: |
          echo "--- Testing POST /api/flashcards/batch ---"
          RESP=$(curl -sf -X POST http://localhost:5000/api/flashcards/batch \
            -H "Content-Type: application/json" \
            -d "{
              \"userId\": \"$USER_ID\",
              \"conversationId\": \"ci-test-conv\",
              \"source\": \"chat-inline\",
              \"flashcards\": [
                {\"word\":\"accomplish\",\"ipa\":\"/əˈkɑːmplɪʃ/\",\"meaning\":\"hoàn thành\",\"example\":\"She accomplished her goals.\"},
                {\"word\":\"negotiate\",\"ipa\":\"/nɪˈɡoʊʃieɪt/\",\"meaning\":\"đàm phán\",\"example\":\"They negotiated a deal.\"},
                {\"word\":\"efficient\",\"ipa\":\"/ɪˈfɪʃənt/\",\"meaning\":\"hiệu quả\",\"example\":\"This method is efficient.\"}
              ]
            }")
          echo "Response: $RESP"
          
          # Verify success và có saved array
          echo $RESP | jq -e '.success == true'
          SAVED_COUNT=$(echo $RESP | jq '.saved | length')
          echo "Saved: $SAVED_COUNT flashcards"
          [ "$SAVED_COUNT" -eq 3 ] || exit 1
          echo "✓ Batch create successful (3 cards saved)"

      # ─── Test 7: Flashcard History ───────────────────────────────────────────────
      # Query history → verify flashcards vừa tạo xuất hiện
      - name: "✅ Test 7: Flashcard History Query"
        run: |
          echo "--- Testing GET /api/flashcards/history ---"
          RESP=$(curl -sf "http://localhost:5000/api/flashcards/history?userId=$USER_ID")
          echo "Response length: $(echo $RESP | wc -c) bytes"
          
          # Verify có flashcards trả về
          COUNT=$(echo $RESP | jq '.flashcards | length')
          echo "Flashcards returned: $COUNT"
          [ "$COUNT" -ge 3 ] || exit 1
          
          # Verify source đúng
          FIRST_SOURCE=$(echo $RESP | jq -r '.flashcards[0].source')
          echo "First card source: $FIRST_SOURCE"
          [ "$FIRST_SOURCE" = "chat-inline" ] || exit 1
          echo "✓ History returns correct flashcards"

      # ─── Test 8: Deduplication ───────────────────────────────────────────────────
      # Tạo lại flashcard trùng word → verify không duplicate
      - name: "✅ Test 8: Flashcard Deduplication"
        run: |
          echo "--- Testing deduplication logic ---"
          # Gửi lại 1 từ đã tồn tại + 1 từ mới
          RESP=$(curl -sf -X POST http://localhost:5000/api/flashcards/batch \
            -H "Content-Type: application/json" \
            -d "{
              \"userId\": \"$USER_ID\",
              \"conversationId\": \"ci-test-conv-2\",
              \"source\": \"chat-inline\",
              \"flashcards\": [
                {\"word\":\"accomplish\",\"ipa\":\"/əˈkɑːmplɪʃ/\",\"meaning\":\"hoàn thành\",\"example\":\"Duplicate test.\"},
                {\"word\":\"collaborate\",\"ipa\":\"/kəˈlæbəreɪt/\",\"meaning\":\"hợp tác\",\"example\":\"Teams collaborate.\"}
              ]
            }")
          echo "Response: $RESP"
          
          # Chỉ 1 card mới được lưu (accomplish bị skip vì trùng)
          SAVED=$(echo $RESP | jq '.saved | length')
          echo "Saved this time: $SAVED (expected: 1, 'accomplish' should be skipped)"
          [ "$SAVED" -eq 1 ] || exit 1
          
          # Verify tổng không bị duplicate
          HISTORY=$(curl -sf "http://localhost:5000/api/flashcards/history?userId=$USER_ID")
          TOTAL=$(echo $HISTORY | jq '.flashcards | length')
          echo "Total flashcards now: $TOTAL (expected: 4)"
          [ "$TOTAL" -eq 4 ] || exit 1
          echo "✓ Deduplication works correctly"

      # ─── Test 9: Flashcard Review ────────────────────────────────────────────────
      # Mark flashcard as reviewed → verify reviewed_at được set
      - name: "✅ Test 9: Mark Flashcard Reviewed"
        run: |
          echo "--- Testing POST /api/flashcards/:id/review ---"
          # Lấy ID của flashcard đầu tiên
          HISTORY=$(curl -sf "http://localhost:5000/api/flashcards/history?userId=$USER_ID")
          CARD_ID=$(echo $HISTORY | jq -r '.flashcards[0].id')
          echo "Reviewing card: $CARD_ID"
          
          RESP=$(curl -sf -X POST "http://localhost:5000/api/flashcards/$CARD_ID/review" \
            -H "Content-Type: application/json" \
            -d '{"known": true}')
          echo "Response: $RESP"
          echo $RESP | jq -e '.success == true'
          echo "✓ Flashcard marked as reviewed"

      # ─── Test 10: Duplicate Signup ───────────────────────────────────────────────
      # Signup với email đã tồn tại → verify trả lỗi duplicate
      - name: "✅ Test 10: Duplicate Signup Rejected"
        run: |
          echo "--- Testing duplicate email rejection ---"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:5000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-integration@test.com","password":"AnotherPass"}')
          echo "HTTP status: $HTTP_CODE (expected: 409)"
          [ "$HTTP_CODE" = "409" ] || [ "$HTTP_CODE" = "400" ]
          echo "✓ Duplicate signup correctly rejected"

      # ─── Test 11: Invalid Login ──────────────────────────────────────────────────
      # Login với password sai → verify trả lỗi
      - name: "✅ Test 11: Invalid Login Rejected"
        run: |
          echo "--- Testing invalid credentials ---"
