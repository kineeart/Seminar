name: CI

on:
  push:
    branches:
      - main
      - develop
      - Final_Project
  pull_request:
    branches:
      - main
      - develop
      - Final_Project

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint + Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          JWT_SECRET: ci-jwt-secret
          MONGODB_URI: mongodb://127.0.0.1:27017/flashcard_ci
          OPENAI_API_KEY: ci-placeholder
          OPENAI_BASE_URL: https://example.invalid
          GEMINI_API_KEY: ci-placeholder

  frontend:
    name: Frontend Lint + Test + Build
    runs-on: ubuntu-latest
    needs: backend

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    defaults:
      run:
        working-directory: app/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist-node-${{ matrix.node-version }}
          path: app/frontend/dist
          retention-days: 7
