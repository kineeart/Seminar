name: CI

on:
  push:
    branches: [main, develop, Final_Project]
  pull_request:
    branches: [main, develop, Final_Project]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20.x
  JWT_SECRET: ci-jwt-secret
  MONGODB_URI: mongodb://127.0.0.1:27017/flashcard_ci
  DATABASE_NAME: flashcard_ci
  LLM_API_KEY: ci-placeholder
  LLM_BASE_URL: https://example.invalid/v1
  LLM_MODEL: gpt-5.5
  GEMINI_API_KEY: ci-placeholder

jobs:
  # ─── Auth Service ────────────────────────────────────────────────────────────
  auth-service:
    name: 🔐 Auth Service
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - run: npm ci
      - name: Lint auth-service
        run: npx eslint auth-service/src --ext .js
      - name: Test auth-service
        run: npx jest --runInBand --passWithNoTests --roots auth-service/src
        env:
          JWT_SECRET: ${{ env.JWT_SECRET }}
          MONGODB_URI: ${{ env.MONGODB_URI }}

  # ─── AI Chat Service ─────────────────────────────────────────────────────────
  ai-chat-service:
    name: 🤖 AI Chat Service
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
    defaults:
      run:
        working-directory: app/backend/ai-chat-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/ai-chat-service/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit Tests
        run: npm test
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
          LLM_BASE_URL: ${{ env.LLM_BASE_URL }}
      - name: Test flashcard-response-parser
        run: npx jest src/tests/flashcard-response-parser --passWithNoTests
      - name: Test prompt-builder
        run: npx jest src/tests/prompt-builder --passWithNoTests

  # ─── Flashcard Service ───────────────────────────────────────────────────────
  flashcard-service:
    name: 🃏 Flashcard Service
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
    defaults:
      run:
        working-directory: app/backend/flashcard-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/flashcard-service/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit Tests
        run: npm test
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}

  # ─── Quiz Service ───────────────────────────────────────────────────────────
  quiz-service:
    name: 📝 Quiz Service
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
    defaults:
      run:
        working-directory: app/backend/quiz-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/quiz-service/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint || true
      - name: Unit Tests
        run: npm test || true
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
          LLM_BASE_URL: ${{ env.LLM_BASE_URL }}

  # ─── Gateway ─────────────────────────────────────────────────────────────────
  gateway:
    name: 🌐 Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/backend/gateway/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint || true
      - name: Health check test
        run: |
          node -e "const app = require('./src/server'); const http = require('http'); const server = http.createServer(app); server.listen(5000, () => { fetch('http://localhost:5000/health').then(r => r.json()).then(d => { console.log('Health:', d); process.exit(d.status === 'ok' ? 0 : 1); }).catch(e => { console.error(e); process.exit(1); }); });" || true

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    name: 🎨 Frontend
    runs-on: ubuntu-latest
    needs: [auth-service, ai-chat-service, flashcard-service]
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit Tests
        run: npm run test || true
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: frontend-dist
          path: app/frontend/dist
          retention-days: 7

  # ─── Integration Tests ──────────────────────────────────────────────────────
  integration:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: [auth-service, ai-chat-service, flashcard-service, gateway]
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install backend deps
        run: npm ci
        working-directory: app/backend
      - name: Start services
        run: |
          cd app/backend
          npx concurrently --kill-others-on-fail --success first --names gw,auth,chat,fc \
            "node gateway/src/server.js" \
            "node auth-service/src/server.js" \
            "node ai-chat-service/src/server.js" \
            "node flashcard-service/src/server.js" &
          sleep 5
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
          LLM_BASE_URL: ${{ env.LLM_BASE_URL }}
      - name: Test Gateway health
        run: |
          curl -sf http://localhost:5000/health | jq .
      - name: Test Auth signup + login flow
        run: |
          # Signup
          SIGNUP=$(curl -sf -X POST http://localhost:5000/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-test@example.com","password":"test123"}')
          echo "Signup: $SIGNUP"
          
          # Login
          LOGIN=$(curl -sf -X POST http://localhost:5000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci-test@example.com","password":"test123"}')
          echo "Login: $LOGIN"
          TOKEN=$(echo $LOGIN | jq -r '.token')
          [ "$TOKEN" != "null" ] && echo "✓ Auth flow OK" || exit 1
      - name: Test Chat endpoint
        run: |
          RESP=$(curl -sf -X POST http://localhost:5000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"message":"hi","level":"Intermediate"}')
          echo "Chat: $RESP"
          echo $RESP | jq -e '.success == true' || exit 1
      - name: Test Flashcard history endpoint
        run: |
          RESP=$(curl -sf "http://localhost:5000/api/flashcards/history?userId=ci-test")
          echo "Flashcard history: $RESP"
          echo $RESP | jq -e '.success == true' || exit 1
      - name: Test Flashcard batch create
        run: |
          RESP=$(curl -sf -X POST http://localhost:5000/api/flashcards/batch \
            -H "Content-Type: application/json" \
            -d '{"userId":"ci-test","conversationId":"ci-conv","flashcards":[{"word":"test","ipa":"/test/","meaning":"kiểm tra","example":"This is a test."}]}')
          echo "Batch create: $RESP"
          echo $RESP | jq -e '.success == true' || exit 1
      - name: Verify flashcard saved
        run: |
          RESP=$(curl -sf "http://localhost:5000/api/flashcards/history?userId=ci-test")
          COUNT=$(echo $RESP | jq '.flashcards | length')
          echo "Flashcards for ci-test: $COUNT"
          [ "$COUNT" -ge 1 ] && echo "✓ Flashcard persistence OK" || exit 1
