name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - Final_Project
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && secrets.FRONTEND_DEPLOY_HOOK_URL != '')
    steps:
      - name: Trigger frontend deploy hook
        run: |
          curl -sS -X POST "${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}"

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && secrets.BACKEND_DEPLOY_HOOK_URL != '')
    steps:
      - name: Trigger backend deploy hook
        run: |
          curl -sS -X POST "${{ secrets.BACKEND_DEPLOY_HOOK_URL }}"
